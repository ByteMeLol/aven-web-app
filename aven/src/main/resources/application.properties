# Application
spring.application.name=aven
server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:aven;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# JWT
aven.jwt.secret=${AVEN_JWT_SECRET}

# Email SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${AVEN_EMAIL}
spring.mail.password=${AVEN_EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB